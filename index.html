<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Matching Game — SI ROOTS</title>
<meta name="description" content="A vanilla JavaScript memory matching game, built by SI ROOTS.">

<meta property="og:title" content="Memory Matching Game — SI ROOTS">
<meta property="og:description" content="Built by SI ROOTS — clean, functional web projects.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>


<body>

    <div class="container">
        <div class="cont  cont1">
            <h1>Memory Matching Game</h1>
            <div class="emoji">❇️❇️❇️</div>

            <button id="startbtn">let's Start</button>

        </div>
        <div class="cont cont2">
            <p id="MovesDisplay">Moves: 0</p>

            <div id="status"> Match The Cards</div>
            <div id="board"></div>
        </div>
        <div id="winScreen">
            <div class="win-box">
                <h1>🎉🎈🎈🎉 You Won! 🎉🎈🎈🎉</h1>
                <p id="winStats">All pairs matched!</p>
                <button id="playAgainBtn">Play Again</button>
            </div>
        </div>
        <div id="looseScreen">
            <div class="loose-box">
                <h1>😭😭 You loose!😭😭</h1>
                <p id="winStats">some pairs are left!</p>
                <button id="playAgain">please Try Again</button>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
